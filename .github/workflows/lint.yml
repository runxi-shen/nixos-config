name: Statix Lint

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'
      - 'README.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '.github/**'
      - 'README.md'

jobs:
  lint:
    runs-on: ubuntu-latest
    outputs:
      lint-success: ${{ steps.build-result.outputs.success }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        # Pinned to a release tag, not @main. @main was inherited from upstream
        # and re-resolves on every run, so CI could break from a third party's
        # push with no change here. The action publishes only major tags, which
        # move within their line, so this still picks up patches -- same
        # convention as actions/checkout@v4 above. Dependabot used to bump this;
        # it was upstream's config and is gone, so this is now a manual bump.
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Run statix linter
        run: |
          echo "Linting Flake..."
          if nix run --extra-experimental-features 'nix-command flakes' nixpkgs#statix -- check .; then
            echo "success=true" >> $GITHUB_ENV
          else
            echo "Lint failed, listing flake.lock for debugging:"
            cat flake.lock
            echo "success=false" >> $GITHUB_ENV
            exit 1
          fi

      - name: Determine lint result
        id: build-result
        run: echo "success=${{ env.success }}" >> $GITHUB_OUTPUT
